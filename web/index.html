<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>tmpshare</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<style>
  @font-face {
    font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 400; font-display: swap;
    src: url('/static/fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 500; font-display: swap;
    src: url('/static/fonts/ibm-plex-sans-latin-500-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 600; font-display: swap;
    src: url('/static/fonts/ibm-plex-sans-latin-600-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 300; font-display: swap;
    src: url('/static/fonts/ibm-plex-mono-latin-300-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 400; font-display: swap;
    src: url('/static/fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 500; font-display: swap;
    src: url('/static/fonts/ibm-plex-mono-latin-500-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 600; font-display: swap;
    src: url('/static/fonts/ibm-plex-mono-latin-600-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 700; font-display: swap;
    src: url('/static/fonts/ibm-plex-mono-latin-700-normal.woff2') format('woff2');
  }
  :root {
    --bg: #07090f;
    --bg-elev: #0c1119;
    --surface: #111722;
    --surface-2: #161e2c;
    --border: #1f2a3c;
    --border-strong: #2c3a52;
    --text: #e6ebf3;
    --text-2: #9aa6bb;
    --text-3: #5c6781;
    --accent: #4dabf7;
    --accent-2: #7cc4ff;
    --accent-soft: rgba(77, 171, 247, .12);
    --ok: #4ec9b0;
    --err: #f47174;
    --line: rgba(255,255,255,.035);
    --on-accent: #061226;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #eef3fa;
      --bg-elev: #f5f8fc;
      --surface: #ffffff;
      --surface-2: #eaf0f8;
      --border: #cdd7e4;
      --border-strong: #94a3b8;
      --text: #0c1726;
      --text-2: #475569;
      --text-3: #7a8597;
      --accent: #1d6fcf;
      --accent-2: #2580ea;
      --accent-soft: rgba(29, 111, 207, .08);
      --ok: #2d8270;
      --err: #b53d3e;
      --line: rgba(0,0,0,.035);
      --on-accent: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    background: var(--bg);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: '';
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 100% 32px,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 32px 100%;
    -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, black 25%, transparent 80%);
            mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, black 25%, transparent 80%);
  }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }

  .wrap {
    position: relative; z-index: 1;
    max-width: 920px; margin: 0 auto;
    padding: 24px 24px 96px;
  }

  /* ─── Topbar ─── */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; margin-bottom: 28px; padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--text-3); flex-wrap: wrap;
  }
  .topbar .left, .topbar .right {
    display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
  }
  .dot {
    display: inline-block; width: 7px; height: 7px;
    background: var(--accent); border-radius: 50%;
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 2.4s ease-in-out infinite;
    margin-right: 8px; vertical-align: middle;
  }
  @keyframes pulse { 0%,100%{ opacity: 1 } 50%{ opacity: .35 } }

  /* ─── Hero ─── */
  .hero { margin-bottom: 36px; }
  .hero h1 {
    font-family: 'IBM Plex Mono', monospace; font-weight: 600;
    font-size: clamp(40px, 8vw, 76px); line-height: .95;
    letter-spacing: -0.045em; margin: 0;
  }
  .hero h1 .slash { color: var(--accent); display: inline-block; }
  .hero h1 .cur {
    color: var(--accent); display: inline-block; width: .55em;
    animation: blink 1.1s steps(2) infinite; margin-left: .05em;
    transform: translateY(-.05em);
  }
  @keyframes blink { 50% { opacity: 0 } }
  .hero .tag {
    display: flex; gap: 12px; align-items: center;
    margin-top: 18px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: .12em;
    color: var(--text-3); text-transform: uppercase;
  }
  .hero .tag::before {
    content: ''; display: block;
    width: 36px; height: 1px; background: var(--accent);
  }

  /* ─── Card with ticked corners (technical-drawing feel) ─── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 24px; position: relative;
  }
  .card.tick::before, .card.tick::after,
  .auth-card::before, .auth-card::after {
    content: ''; position: absolute;
    width: 10px; height: 10px;
    border: 1px solid var(--accent);
    pointer-events: none;
  }
  .card.tick::before, .auth-card::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .card.tick::after,  .auth-card::after  { bottom: -1px; right: -1px; border-left: none; border-top: none; }

  /* ─── Field label ─── */
  .label {
    display: flex; align-items: center; gap: 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--text-3); margin-bottom: 10px;
  }
  .label::before {
    content: ''; width: 16px; height: 1px; background: var(--border-strong);
  }

  /* ─── Inputs ─── */
  input.input {
    width: 100%; padding: 12px 14px;
    background: var(--bg-elev); color: var(--text);
    border: 1px solid var(--border);
    font-family: 'IBM Plex Mono', monospace; font-size: 14px;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  input.input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  input.input::placeholder { color: var(--text-3); }
  input.input:disabled { opacity: .55; }

  /* ─── Buttons ─── */
  .btn {
    padding: 12px 20px; border: 1px solid var(--accent);
    background: var(--accent); color: var(--on-accent);
    font-family: 'IBM Plex Mono', monospace; font-weight: 600;
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    cursor: pointer; transition: all .15s; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .btn:hover:not(:disabled) { background: var(--accent-2); border-color: var(--accent-2); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-ghost {
    background: transparent; color: var(--text-2);
    border: 1px solid var(--border); padding: 8px 14px;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    letter-spacing: .1em; text-transform: uppercase; cursor: pointer;
    transition: all .15s;
  }
  .btn-ghost:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .btn-danger {
    background: transparent; color: var(--err);
    border: 1px solid var(--border);
    padding: 6px 12px; font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    cursor: pointer; transition: all .15s;
  }
  .btn-danger:hover { border-color: var(--err); background: rgba(244,113,116,.1); }

  .row { display: flex; gap: 10px; align-items: stretch; }
  .row > input.input { flex: 1; min-width: 0; }

  /* ─── Drop zone ─── */
  .drop {
    border: 1px dashed var(--border-strong);
    padding: 56px 24px; text-align: center; cursor: pointer;
    background: linear-gradient(180deg, var(--bg-elev) 0%, var(--surface) 100%);
    transition: all .18s; position: relative;
  }
  .drop input { display: none; }
  .drop:hover, .drop.over {
    border-color: var(--accent);
    background: linear-gradient(180deg, var(--accent-soft) 0%, var(--surface) 100%);
  }
  .drop .glyph {
    font-family: 'IBM Plex Mono', monospace; font-weight: 300;
    font-size: 40px; color: var(--accent); letter-spacing: .14em;
    margin-bottom: 14px; transition: transform .2s;
  }
  .drop:hover .glyph, .drop.over .glyph { transform: translateY(-3px); }
  .drop .main {
    font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500;
  }
  .drop .sub {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    color: var(--text-3); letter-spacing: .14em; text-transform: uppercase;
    margin-top: 8px;
  }

  .opts { margin-top: 22px; }
  .help {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    color: var(--text-3); margin-top: 8px; line-height: 1.6;
  }
  .help code {
    background: var(--bg-elev); border: 1px solid var(--border);
    padding: 1px 5px; color: var(--text-2);
  }

  /* ─── Section header ─── */
  .section-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin: 36px 0 14px; padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .section-head h2 {
    margin: 0; font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; font-weight: 600;
    letter-spacing: .14em; text-transform: uppercase; color: var(--text-2);
  }
  .section-head h2::before { content: '── '; color: var(--accent); }
  .section-head .count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; color: var(--text-3); letter-spacing: .06em;
  }

  /* ─── Upload item ─── */
  .item {
    background: var(--surface); border: 1px solid var(--border);
    padding: 18px 20px; margin-bottom: 10px;
    transition: border-color .2s;
  }
  .item.uploading {
    border-color: var(--accent);
    box-shadow: inset 3px 0 0 var(--accent);
  }
  .item.error {
    border-color: var(--err);
    box-shadow: inset 3px 0 0 var(--err);
  }
  .item.done {
    box-shadow: inset 3px 0 0 var(--ok);
  }
  .item-head {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 12px; margin-bottom: 10px;
  }
  .item-head .name {
    font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 14px;
    word-break: break-all; display: flex; gap: 10px; align-items: baseline;
  }
  .marker {
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; flex-shrink: 0;
    width: 16px; text-align: center;
  }
  .item.done .marker { color: var(--ok); }
  .item.error .marker { color: var(--err); }
  .item.uploading .marker { color: var(--accent); }
  .item-head .size {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px;
    color: var(--text-3); flex-shrink: 0; font-variant-numeric: tabular-nums;
  }

  /* Progress */
  .progress {
    height: 4px; background: var(--bg-elev); position: relative;
    overflow: hidden; margin: 12px 0 4px;
  }
  .progress > .fill {
    height: 100%; background: var(--accent);
    transition: width .25s ease-out; position: relative;
  }
  .progress > .fill::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.22) 50%, transparent 100%);
    animation: shimmer 1.6s linear infinite;
  }
  @keyframes shimmer { from { transform: translateX(-100%) } to { transform: translateX(100%) } }
  .ticks {
    display: flex; justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace; font-size: 9px;
    color: var(--text-3); letter-spacing: .04em;
    margin-bottom: 14px; font-variant-numeric: tabular-nums;
  }

  /* Stats grid (key/value pairs) */
  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 16px;
  }
  .stat { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .stat .k {
    font-family: 'IBM Plex Mono', monospace; font-size: 9px;
    letter-spacing: .14em; text-transform: uppercase; color: var(--text-3);
  }
  .stat .v {
    font-family: 'IBM Plex Mono', monospace; font-size: 13px;
    color: var(--text); font-weight: 500;
    font-variant-numeric: tabular-nums;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .stat .v.accent { color: var(--accent); }
  .stat .v.ok { color: var(--ok); }

  /* URL rows */
  .urls {
    display: flex; flex-direction: column; gap: 8px;
    margin-top: 14px; padding-top: 14px;
    border-top: 1px dashed var(--border);
  }
  .url-row { display: flex; gap: 8px; align-items: stretch; min-width: 0; }
  .url-row .ulabel {
    font-family: 'IBM Plex Mono', monospace; font-size: 9px;
    letter-spacing: .16em; text-transform: uppercase;
    color: var(--text-3); align-self: center;
    width: 56px; flex-shrink: 0; padding-right: 4px;
    border-right: 1px solid var(--border);
    text-align: right;
  }
  .url-row .uval {
    flex: 1; min-width: 0;
    font-family: 'IBM Plex Mono', monospace; font-size: 12px;
    padding: 9px 12px;
    background: var(--bg-elev); border: 1px solid var(--border);
    color: var(--text);
    overflow-x: auto; white-space: nowrap;
    user-select: all;
  }
  .url-row .uval:hover { border-color: var(--border-strong); }
  .url-row .uval::-webkit-scrollbar { height: 0; display: none; }

  /* Done footer (expire/key) */
  .done-meta {
    margin-top: 14px; padding-top: 14px;
    border-top: 1px dashed var(--border);
  }

  /* Empty state */
  .empty {
    padding: 32px 20px; text-align: center;
    border: 1px dashed var(--border);
    color: var(--text-3); font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; letter-spacing: .04em;
  }

  /* Auth screen */
  .auth-wrap { min-height: 70vh; display: flex; flex-direction: column; justify-content: center; }
  .auth-card {
    background: var(--surface); border: 1px solid var(--border);
    padding: 32px; position: relative;
  }
  .auth-status {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    color: var(--accent); letter-spacing: .18em; text-transform: uppercase;
    margin-bottom: 24px; display: flex; align-items: center; gap: 10px;
  }
  .auth-status .sq {
    width: 7px; height: 7px; background: var(--accent);
    animation: blink 1.1s steps(2) infinite;
  }

  /* Errors */
  .err-text {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px;
    color: var(--err); margin-top: 14px;
    padding: 10px 12px; background: rgba(244,113,116,.06);
    border-left: 2px solid var(--err);
  }
  .err-text::before { content: '! '; font-weight: 700; }

  /* Loader */
  .loader {
    display: inline-block; width: 14px; height: 2px;
    background: currentColor; opacity: .8;
    animation: loader 1.2s steps(8) infinite;
  }
  @keyframes loader { 0% { width: 0 } 100% { width: 14px } }

  /* Footer */
  .footer {
    margin-top: 48px; padding-top: 16px;
    border-top: 1px solid var(--border);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--text-3); text-align: center;
  }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%);
    background: var(--surface-2); border: 1px solid var(--accent);
    color: var(--text); padding: 10px 18px;
    font-family: 'IBM Plex Mono', monospace; font-size: 12px;
    letter-spacing: .04em; z-index: 100;
    animation: toast-in .18s ease-out;
    box-shadow: 0 4px 24px rgba(0,0,0,.4);
  }
  @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px) } }

  @media (max-width: 600px) {
    .wrap { padding: 16px 16px 96px; }
    .topbar { font-size: 10px; gap: 12px; }
    .topbar .left, .topbar .right { gap: 12px; }
    .url-row .ulabel { width: 44px; font-size: 8px; }
    .item { padding: 14px; }
  }
</style>
</head>
<body>
<div class="wrap" id="root"></div>

<script type="module" src="/vendor/app.js"></script>
</body>
</html>
